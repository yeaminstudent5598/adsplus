<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <title>AdPulse BD</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>AdPulse BD <span>settings</span></h1>

  <section>
    <h2>Real data (নিজের Ad Account)</h2>
    <p class="hint">শুধু <b>আপনার নিজের</b> এডের আসল spend/orders আসবে। প্রতিযোগীর এডের আসল ডেটা Meta দেয় না।</p>
    <label>Access Token (ads_read)
      <input type="password" id="fbToken" autocomplete="off" placeholder="EAAB… (saved থাকলে খালি রাখুন)" />
    </label>
    <label>Ad Account ID
      <input type="text" id="fbAccount" placeholder="act_1234567890 বা শুধু নম্বর" />
    </label>
    <div class="actions">
      <button id="saveReal">Save</button>
      <button id="testReal" class="ghost">Test connection</button>
      <button id="clearReal" class="ghost">Clear token</button>
    </div>
    <div id="realMsg" class="msg"></div>
  </section>

  <section>
    <h2>Benchmarks (estimate এর জন্য)</h2>
    <label class="toggle">
      <input type="checkbox" id="enabled" />
      <span>Enable on Ad Library</span>
    </label>
    <label class="toggle">
      <input type="checkbox" id="showEstimates" />
      <span>Competitor এডের estimate (model) দেখাও</span>
    </label>
    <div class="grid">
      <label>USD → BDT <input type="number" step="0.01" id="fx" /></label>
      <label>Default price (৳) <input type="number" step="1" id="defaultPriceBDT" /></label>
      <label>CPM ($) <input type="number" step="0.01" id="cpm" /></label>
      <label>CTR (%) <input type="number" step="0.01" id="ctrPct" /></label>
      <label>Click→Order (%) <input type="number" step="0.01" id="cvrPct" /></label>
      <label>Frequency <input type="number" step="0.01" id="frequency" /></label>
      <label>Hook rate (%) <input type="number" step="0.1" id="hookPct" /></label>
      <label>Hold rate (%) <input type="number" step="0.1" id="holdPct" /></label>
      <label>Avg watch (sec) <input type="number" step="0.1" id="avgWatchSec" /></label>
      <label>Reaction (% of views) <input type="number" step="0.01" id="reactPct" /></label>
      <label>Comment (% of views) <input type="number" step="0.01" id="commentPct" /></label>
      <label>Share (% of views) <input type="number" step="0.01" id="sharePct" /></label>
      <label>Click→Message (%) <input type="number" step="0.1" id="msgPct" /></label>
      <label>Click→Lead (%) <input type="number" step="0.1" id="leadPct" /></label>
      <label>Click→App install (%) <input type="number" step="0.1" id="appPct" /></label>
      <label>Click→Call (%) <input type="number" step="0.1" id="callPct" /></label>
      <label>Click→LP view (%) <input type="number" step="0.1" id="lpvPct" /></label>
    </div>
    <div class="actions">
      <button id="save">Save</button>
      <button id="calibrate" class="ghost">Calibrate from my ads</button>
      <button id="reset" class="ghost">Reset</button>
    </div>
    <div id="msg" class="msg"></div>
  </section>

  <script src="../src/estimator.js"></script>
  <script src="popup.js"></script>
</body>
</html>
